name: Build Basemental FG 250

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FUSION_VERSION: "1.4.0"
  # TONE3000 publishable key (t3k_pub_...): repo Settings > Secrets and variables > Actions > Variables
  T3K_PUBLISHABLE_KEY: ${{ vars.T3K_PUBLISHABLE_KEY }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-2022
            cmake_extra: ""
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: -DFUSION_GUI_TEST=ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: |
          TARGETS="Fusion250_All render_test tuner_test tuner_stress_test comp_test"
          [ "$RUNNER_OS" = "Linux" ] && TARGETS="$TARGETS gui_snapshot"
          cmake --build build --config Release --parallel 4 --target $TARGETS

      - name: DSP and tuner tests
        shell: bash
        run: |
          B=build; [ -d build/Release ] && [ -f build/Release/render_test.exe ] && B=build/Release
          X=""; [ "$RUNNER_OS" = "Windows" ] && X=".exe"
          "$B/render_test$X" .
          "$B/tuner_test$X"
          "$B/tuner_stress_test$X"
          "$B/comp_test$X"

      - name: Python compressor prototype (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet numpy
          python3 prototypes/fet_compressor.py

      - name: End-to-end tuner test in the real plug-in (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/gui_snapshot .

      # ---------------------------------------------------------------- macOS
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: bash installer/mac/build-pkg.sh build/Fusion250_artefacts/Release "$FUSION_VERSION"

      - name: Test macOS installer (install + auval, like Logic)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg "dist/BasementalFG250-$FUSION_VERSION-macOS-Installer.pkg" -target /
          test -d "/Library/Audio/Plug-Ins/Components/Basemental FG 250.component"
          test -d "/Library/Audio/Plug-Ins/VST3/Basemental FG 250.vst3"
          killall -9 AudioComponentRegistrar || true
          auval -v aufx F250 Fsna | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log

      # -------------------------------------------------------------- Windows
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:FUSION_VERSION" "/DArtDir=$pwd\build\Fusion250_artefacts\Release" "/DSrcDir=$pwd" installer\windows\Fusion250.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test Windows installer (silent install + uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\BasementalFG250-*-Windows-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $vst = "$env:CommonProgramFiles\VST3\Basemental FG 250.vst3"
          if (-not (Test-Path $vst)) { Write-Error "VST3 not installed"; exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\Basemental FG 250\Basemental FG 250.exe")) { Write-Error "Standalone not installed"; exit 1 }
          Write-Host "Installed OK: $vst"
          & "$env:ProgramFiles\Basemental FG 250\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path $vst) { Write-Error "Uninstall left the VST3 behind"; exit 1 }
          Write-Host "Uninstall OK"

      # ---------------------------------------------------------------- Linux
      - name: Build and test Linux installer
        if: runner.os == 'Linux'
        run: |
          P="BasementalFG250-$FUSION_VERSION-Linux"
          mkdir -p "dist/$P"
          ART=build/Fusion250_artefacts/Release
          cp -R "$ART/VST3/Basemental FG 250.vst3" "$ART/LV2/Basemental FG 250.lv2" "dist/$P/"
          cp installer/linux/install.sh README.md "dist/$P/"
          chmod +x "dist/$P/install.sh"
          tar -C dist -czf "dist/$P.tar.gz" "$P"
          bash "dist/$P/install.sh"
          test -f "$HOME/.vst3/Basemental FG 250.vst3/Contents/x86_64-linux/Basemental FG 250.so"
          bash "dist/$P/install.sh" --uninstall
          rm -rf "dist/$P"

      - name: Add REAPER JSFX, README and manual
        shell: bash
        run: cp JSFX/Fusion250.jsfx README.md docs/BasementalFG250-Manual.pdf dist/

      - uses: actions/upload-artifact@v4
        with:
          name: BasementalFG250-${{ matrix.name }}-Installer
          path: dist

  # Publishes the tested installers as a GitHub Release (v<FUSION_VERSION>) when a
  # commit message contains [release], a version tag is pushed, or the workflow
  # is run by hand from the Actions tab.
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir release
          find artifacts -name '*-macOS-Installer.pkg' -exec cp {} release/ \;
          find artifacts -name '*-Windows-Setup.exe' -exec cp {} release/ \;
          find artifacts -name '*-Linux.tar.gz' -exec cp {} release/ \;
          cp "$(find artifacts -name 'Fusion250.jsfx' | head -1)" release/BasementalFG250-REAPER.jsfx
          cp "$(find artifacts -name 'BasementalFG250-Manual.pdf' | head -1)" "release/BasementalFG250-${FUSION_VERSION}-Manual.pdf"
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FUSION_VERSION }}
          name: Basemental FG 250 v${{ env.FUSION_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/*
          body: |
            **Basemental FG 250** two-channel fusion amp with a 0.1-cent strobe tuner and the FET Stack compressor.

            📖 **New here? Download the manual:** `BasementalFG250-${{ env.FUSION_VERSION }}-Manual.pdf` (below), or read it online: [docs/MANUAL.md](https://github.com/${{ github.repository }}/blob/main/docs/MANUAL.md)

            | Download | For |
            |---|---|
            | `BasementalFG250-*-macOS-Installer.pkg` | **Logic Pro**, GarageBand, MainStage (AU) and other Mac DAWs (VST3). Apple Silicon + Intel |
            | `BasementalFG250-*-Windows-Setup.exe` | Windows DAWs (VST3) + standalone app |
            | `BasementalFG250-*-Linux.tar.gz` | Linux (VST3 + LV2), run `./install.sh` |
            | `BasementalFG250-REAPER.jsfx` | REAPER, no install needed (no tuner or FET Stack) |
            | `BasementalFG250-*-Manual.pdf` | User manual |
            | `BasementalFG250-*-NAM-IR-Pack.zip` | NAM A2 amp captures + cabinet IRs (TONE3000 / LAVA STUDIO), attached by the NAM workflow |

            ### Install on a Mac (Logic Pro)
            1. Quit Logic and double-click the `.pkg`.
            2. If macOS says it can't verify the developer: **System Settings › Privacy & Security › Open Anyway**, then run it again.
            3. Keep **Audio Unit** and **VST3** ticked and finish the installer.
            4. Open Logic › Audio FX slot › **Audio Units › Basemental › Basemental FG 250**.
               Not listed? **Logic Pro › Settings › Plug-in Manager › Reset & Rescan Selection**.

            ### Install on Windows
            Run the `Setup.exe` (SmartScreen: **More info › Run anyway**). The VST3 goes to `C:\Program Files\Common Files\VST3`.

            ### What's new in ${{ env.FUSION_VERSION }}
            - **TONE3000 + NAM** (click **TONE3000**): run any NAM amp capture in place of the FG 250 channels, and any IR in place of the cabinet. Pick tones on tone3000.com with **Browse TONE3000**, or load `.nam` / `.wav` files from disk.
            - A2 captures run in **Full** or **Lite** size; **Normalize** brings every capture to the same loudness.
            - The FET Stack, guitar voices, reverb, tuner and meters all work with NAM captures.
            - User IRs now play at the same level as the built-in cabinet.

            Every installer was installed and checked on its own operating system before release (`auval` for the Logic AU).
